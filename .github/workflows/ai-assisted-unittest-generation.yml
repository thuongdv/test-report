name: AI-Assisted Unit Test Generation Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: write
  statuses: write

jobs:
  ai-unittest-generation:
    name: AI Unit Test Generation & Validation
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' && !startsWith(github.head_ref, 'ai/generated-tests/') }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js & Cache Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 3. Code Quality Checks (Formatter & Linter)
        run: |
          echo "Executing Step 1: Code Quality Checks..."
          if npm run | grep -q "format:check"; then
            npm run format:check
          fi
          if npm run | grep -q "lint"; then
            npm run lint
          fi

      - name: 4. Run Existing Unit Test Suite
        run: |
          echo "Executing Step 2: Existing Unit Test Suite..."
          if npm run | grep -q "test"; then
            npm test
          fi

      - name: 5. Perform AI-Assisted Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node .github/scripts/ai-test-generator.js --mode review --base-ref "origin/${{ github.base_ref }}"

      - name: 6. Generate or Update Unit Tests (AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node .github/scripts/ai-test-generator.js --mode generate --base-ref "origin/${{ github.base_ref }}"

      - name: 7. Execute Complete Unit Test Suite & AI Retry Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node .github/scripts/ai-test-generator.js --mode retry-loop --base-ref "origin/${{ github.base_ref }}"

      - name: 8. Create Temporary AI Branch & Commit
        id: create-branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH_NAME="ai/generated-tests/${PR_NUMBER}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git checkout -b "${BRANCH_NAME}"
            git add .
            git commit -m "test(ai): auto-generated unit tests and required fixes for PR #${PR_NUMBER}"
            git push origin "${BRANCH_NAME}" --force
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No test changes generated."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 9. Create AI Pull Request & Auto-Merge
        if: steps.create-branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch_name }}
        run: |
          echo "Creating AI Pull Request targeting ${HEAD_REF}..."
          AI_PR_URL=$(gh pr create \
            --title "test(ai): generated unit tests for PR #${PR_NUMBER}" \
            --body "Automated AI-assisted unit test generation for PR #${PR_NUMBER}.

            ### Summary of Changes
            - Auto-generated / updated unit test suite
            - Verified all unit tests pass cleanly
            - Retries performed: <= 3 attempts" \
            --head "${BRANCH_NAME}" \
            --base "${HEAD_REF}")

          echo "AI PR created: ${AI_PR_URL}"

          echo "Auto-merging AI PR into feature branch ${HEAD_REF}..."
          gh pr merge "${AI_PR_URL}" --auto --squash --delete-branch || gh pr merge "${AI_PR_URL}" --merge --delete-branch

      - name: 10. Re-run CI Validation & Workflow Summary
        if: always()
        run: |
          echo "### 🧪 AI-Assisted Unit Test Generation Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number**: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Feature Branch**: \`${{ github.head_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed successfully" >> $GITHUB_STEP_SUMMARY
