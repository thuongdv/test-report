name: AI-Assisted Unit Test Generation Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-flight runs for the same PR
concurrency:
  group: ai-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  ai-unittest-generation:
    name: AI Unit Test Generation & Validation
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' && !startsWith(github.head_ref, 'ai/generated-tests/') }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js & install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 3. Code Quality Checks
        run: |
          echo "Running formatter check..."
          npx turbo format:check
          echo "Running linter..."
          npm run lint

      - name: 4. Run Existing Unit Test Suite
        run: npm test

      - name: 5. AI Review, Generate & Test (with retry)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          node .github/scripts/ai-test-generator.js \
            --base-ref "origin/${{ github.base_ref }}"

      - name: 6. Create Temporary AI Branch & Commit
        id: create-branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH_NAME="ai/generated-tests/${PR_NUMBER}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git checkout -b "${BRANCH_NAME}"
            git add .
            git commit -m "test(ai): auto-generated unit tests for PR #${PR_NUMBER}"
            git push origin "${BRANCH_NAME}" --force
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No test changes generated."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 7. Create AI Pull Request & Auto-Merge
        if: steps.create-branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch_name }}
        run: |
          echo "Creating AI Pull Request targeting ${HEAD_REF}..."
          AI_PR_URL=$(gh pr create \
            --title "test(ai): generated unit tests for PR #${PR_NUMBER}" \
            --body "Automated AI-assisted unit test generation for PR #${PR_NUMBER}.

          ### Summary
          - Auto-generated / updated unit tests
          - All unit tests verified passing
          - Max retry attempts: 3" \
            --head "${BRANCH_NAME}" \
            --base "${HEAD_REF}")

          echo "AI PR created: ${AI_PR_URL}"

          # Auto-merge requires branch protection with auto-merge enabled.
          echo "Auto-merging AI PR into ${HEAD_REF}..."
          gh pr merge "${AI_PR_URL}" --auto --squash --delete-branch

      - name: 8. Workflow Summary
        if: always()
        run: |
          echo "### 🧪 AI-Assisted Unit Test Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.head_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
