name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore:
      - "ai/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Code Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run unit test suite
        run: npm test

  ai-review:
    name: Gemini AI Code Review
    needs: validate
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Run AI Code Review
        id: review
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        run: |
          DIFF_CONTENT=$(git diff "origin/${{ github.base_ref }}...HEAD")

          if [ -z "$DIFF_CONTENT" ]; then
            echo "No code changes detected in diff."
            echo "review_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT_TEXT=$(cat prompts/review.md)

          echo "$DIFF_CONTENT" | gemini -p "$PROMPT_TEXT" > review-output.md

          if grep -qi "BLOCKING\|CRITICAL" review-output.md; then
            echo "review_status=blocking" >> "$GITHUB_OUTPUT"
          else
            echo "review_status=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Review Comment to PR
        if: always() && steps.review.outputs.review_status != 'skipped' && hashFiles('review-output.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewText = fs.readFileSync('review-output.md', 'utf8');
            const status = '${{ steps.review.outputs.review_status }}';
            const icon = status === 'blocking' ? '🚨' : '✅';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## ${icon} Gemini AI Code Review Summary\n\n${reviewText}`
            });

      - name: Fail Workflow if Blocking Issues Found
        if: steps.review.outputs.review_status == 'blocking'
        run: |
          echo "::error::Gemini AI review identified critical or blocking issues. Please check the PR review comment."
          exit 1
