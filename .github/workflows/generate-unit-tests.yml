name: AI Unit Test Generation

on:
  workflow_run:
    workflows: ["PR Validation"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    name: Generate & Validate Unit Tests
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_branch, 'ai/')
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate & Validate Unit Tests
        env:
          BASE_REF: "origin/${{ github.event.workflow_run.pull_requests[0].base.ref || 'main' }}"
        run: npx ts-node scripts/agents/cli.ts generate-tests

      - name: Create AI Pull Request
        run: npx ts-node scripts/agents/cli.ts create-pr
